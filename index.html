<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ficha de Cata Web</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-4">
      <h1>Ficha de Cata Web</h1>

      <section id="vista-carga" aria-labelledby="titulo-carga">
        <h2 id="titulo-carga">Nueva ficha</h2>
        <form id="form-ficha" aria-label="Formulario de ficha de cata">
          <div class="mb-3">
            <label class="form-label" for="bodega">Bodega</label>
            <input class="form-control" id="bodega" name="bodega" type="text" />
          </div>
        </form>
      </section>

      <section id="vista-busqueda" aria-labelledby="titulo-busqueda" hidden>
        <h2 id="titulo-busqueda">Buscar fichas</h2>
        <div class="mb-3">
          <label class="form-label" for="busqueda"
            >Búsqueda por bodega o línea</label
          >
          <input class="form-control" id="busqueda" type="search" />
        </div>
      </section>

      <section id="vista-edicion" aria-labelledby="titulo-edicion" hidden>
        <h2 id="titulo-edicion">Editar ficha</h2>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
