<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ficha de Cata Web</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/estilos.css" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="container py-4">
      <h1>Ficha de Cata Web</h1>

      <nav class="mb-4 d-flex gap-2" aria-label="Secciones de la app">
        <button type="button" class="btn btn-outline-primary" data-ir="carga">
          Cargar ficha
        </button>
        <button
          type="button"
          class="btn btn-outline-primary"
          data-ir="busqueda"
        >
          Buscar fichas
        </button>
      </nav>

      <section id="vista-carga" aria-labelledby="titulo-carga">
        <div class="d-flex gap-3 align-items-center mb-3">
          <h2 id="titulo-carga" class="my-0">Nueva ficha</h2>
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            id="nueva-ficha"
          >
            Nueva ficha
          </button>
        </div>
        <form id="form-ficha" aria-label="Formulario de ficha de cata">
          <fieldset class="mb-4">
            <legend class="fs-5">Datos del vino</legend>
            <div class="mb-3">
              <label class="form-label" for="bodega">Bodega</label>
              <input
                class="form-control"
                id="bodega"
                name="bodega"
                type="text"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="pais">País</label>
              <input class="form-control" id="pais" name="pais" type="text" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="provincia">Provincia</label>
              <input
                class="form-control"
                id="provincia"
                name="provincia"
                type="text"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="zona">Zona</label>
              <input class="form-control" id="zona" name="zona" type="text" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="tipo">Tipo de vino</label>
              <select class="form-select" id="tipo" name="tipo"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="linea"
                >Nombre de la línea de vino</label
              >
              <input class="form-control" id="linea" name="linea" type="text" />
            </div>
            <fieldset id="composicion">
              <legend class="fs-6">Composición (una fila por cepa)</legend>
            </fieldset>
            <button
              type="button"
              class="btn btn-outline-secondary"
              id="agregar-cepa"
            >
              Agregar cepa
            </button>
            <p id="suma-composicion" class="form-text" aria-live="polite"></p>
            <div class="mb-3">
              <label class="form-label" for="cosecha">Cosecha</label>
              <select class="form-select" id="cosecha" name="cosecha"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="graduacion"
                >Graduación alcohólica</label
              >
              <input
                class="form-control"
                id="graduacion"
                name="graduacion"
                type="number"
                step="0.1"
                min="0"
                max="100"
              />
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="fs-5">Fase visual / color</legend>
            <div class="mb-3">
              <label class="form-label" for="tono_matiz">Tono o matiz</label>
              <select
                class="form-select"
                id="tono_matiz"
                name="tono_matiz"
              ></select>
            </div>
            <div id="bloque-espumante" hidden>
              <div class="mb-3">
                <label class="form-label" for="color_espumante"
                  >Color del espumante</label
                >
                <select
                  class="form-select"
                  id="color_espumante"
                  name="color_espumante"
                ></select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="metodo_espumante"
                  >Método de elaboración</label
                >
                <select
                  class="form-select"
                  id="metodo_espumante"
                  name="metodo_espumante"
                ></select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="intensidad_color"
                >Intensidad del color</label
              >
              <select
                class="form-select"
                id="intensidad_color"
                name="intensidad_color"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="vivacidad_brillo"
                >Vivacidad y brillo</label
              >
              <select
                class="form-select"
                id="vivacidad_brillo"
                name="vivacidad_brillo"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="limpieza_transparencia"
                >Limpieza y transparencia</label
              >
              <select
                class="form-select"
                id="limpieza_transparencia"
                name="limpieza_transparencia"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="evolucion_color"
                >Evolución (color)</label
              >
              <select
                class="form-select"
                id="evolucion_color"
                name="evolucion_color"
              ></select>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="fs-5">Fase olfativa</legend>
            <div class="mb-3">
              <label class="form-label" for="limpieza_franqueza"
                >Limpieza o franqueza</label
              >
              <select
                class="form-select"
                id="limpieza_franqueza"
                name="limpieza_franqueza"
              ></select>
            </div>
            <div class="mb-3" id="bloque-defecto" hidden>
              <label class="form-label" for="defecto">Defecto</label>
              <select class="form-select" id="defecto" name="defecto"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="expresion_intensidad"
                >Expresión-Intensidad</label
              >
              <select
                class="form-select"
                id="expresion_intensidad"
                name="expresion_intensidad"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="equilibrio">Equilibrio</label>
              <select
                class="form-select"
                id="equilibrio"
                name="equilibrio"
              ></select>
            </div>
            <fieldset id="notas-aromaticas">
              <legend class="fs-6">Notas aromáticas</legend>
            </fieldset>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="fs-5">Fase gustativa</legend>
            <div class="mb-3">
              <label class="form-label" for="dulzor">Dulzor</label>
              <select class="form-select" id="dulzor" name="dulzor"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="acidez">Acidez</label>
              <select class="form-select" id="acidez" name="acidez"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="taninos_cantidad"
                >Taninos (cantidad)</label
              >
              <select
                class="form-select"
                id="taninos_cantidad"
                name="taninos_cantidad"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="taninos_calidad"
                >Taninos (calidad)</label
              >
              <select
                class="form-select"
                id="taninos_calidad"
                name="taninos_calidad"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="alcohol_percepcion"
                >Alcohol (percepción en boca)</label
              >
              <select
                class="form-select"
                id="alcohol_percepcion"
                name="alcohol_percepcion"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="cuerpo">Cuerpo</label>
              <select class="form-select" id="cuerpo" name="cuerpo"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="entrada">Entrada</label>
              <select class="form-select" id="entrada" name="entrada"></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="evolucion_boca"
                >Evolución o medio de boca</label
              >
              <input
                class="form-control"
                id="evolucion_boca"
                name="evolucion_boca"
                type="text"
              />
            </div>
            <fieldset id="aromas-boca">
              <legend class="fs-6">Aromas de boca</legend>
            </fieldset>
            <div class="mb-3">
              <label class="form-label" for="impresion_final"
                >Impresión final</label
              >
              <select
                class="form-select"
                id="impresion_final"
                name="impresion_final"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="postgusto">Postgusto</label>
              <select
                class="form-select"
                id="postgusto"
                name="postgusto"
              ></select>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="fs-5">Apreciación personal</legend>
            <div class="mb-3">
              <label class="form-label" for="apreciacion"
                >Apreciación personal del vino</label
              >
              <textarea
                class="form-control"
                id="apreciacion"
                name="apreciacion"
                rows="3"
              ></textarea>
            </div>
          </fieldset>

          <div class="mb-3">
            <button type="submit" class="btn btn-primary" id="guardar">
              Guardar
            </button>
          </div>
          <p
            id="estado-guardado"
            class="form-text"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>

      <section id="vista-busqueda" aria-labelledby="titulo-busqueda" hidden>
        <h2 id="titulo-busqueda">Buscar fichas</h2>
        <div class="mb-3">
          <label class="form-label" for="busqueda"
            >Búsqueda por bodega o línea</label
          >
          <input class="form-control" id="busqueda" type="search" />
        </div>
        <div id="resultados-busqueda"></div>
        <p
          id="estado-busqueda"
          class="form-text"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section id="vista-edicion" aria-labelledby="titulo-edicion" hidden>
        <h2 id="titulo-edicion">Editar ficha</h2>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
